<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Abstract ultrasound scan with a needle guide line">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#12303d"/>
      <stop offset="60%" stop-color="#0b1d26"/>
      <stop offset="100%" stop-color="#06121a"/>
    </radialGradient>
    <linearGradient id="fan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fe3d0" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#3ea8a0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0b1d26" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#d9fff6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7fe3d0" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="target" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9df5e3" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#4fd2bd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fd2bd" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="speckle">
        <feFuncA type="linear" slope="0.5" intercept="-0.2"/>
      </feComponentTransfer>
      <feComposite in="speckle" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="fanClip">
      <path d="M600 120 L960 860 L240 860 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- ultrasound sector -->
  <g clip-path="url(#fanClip)">
    <rect x="200" y="100" width="800" height="800" fill="url(#fan)"/>
    <g stroke="#8ef0dd" fill="none" opacity="0.28">
      <path d="M600 150 m-40 0 a40 40 0 1 0 80 0 a40 40 0 1 0 -80 0" stroke-width="2"/>
      <path d="M600 150 m-120 0 a120 120 0 1 0 240 0 a120 120 0 1 0 -240 0" stroke-width="2"/>
      <path d="M600 150 m-220 0 a220 220 0 1 0 440 0 a220 220 0 1 0 -440 0" stroke-width="2"/>
      <path d="M600 150 m-340 0 a340 340 0 1 0 680 0 a340 340 0 1 0 -680 0" stroke-width="2"/>
      <path d="M600 150 m-480 0 a480 480 0 1 0 960 0 a480 480 0 1 0 -960 0" stroke-width="2"/>
    </g>
    <g stroke="#6fd8c6" opacity="0.16" stroke-width="1.5">
      <line x1="600" y1="150" x2="600" y2="880"/>
      <line x1="600" y1="150" x2="360" y2="880"/>
      <line x1="600" y1="150" x2="840" y2="880"/>
      <line x1="600" y1="150" x2="180" y2="800"/>
      <line x1="600" y1="150" x2="1020" y2="800"/>
    </g>
    <!-- tissue texture -->
    <ellipse cx="600" cy="640" rx="290" ry="150" fill="#2c7f7a" opacity="0.22" filter="url(#soften)"/>
    <ellipse cx="565" cy="655" rx="110" ry="70" fill="#3f9c8f" opacity="0.28" filter="url(#soften)"/>
    <ellipse cx="700" cy="600" rx="70" ry="45" fill="#0c2b33" opacity="0.5" filter="url(#soften)"/>
    <rect x="220" y="120" width="760" height="760" fill="#ffffff" opacity="0.05" filter="url(#grain)"/>
  </g>

  <!-- needle guide path -->
  <line x1="300" y1="150" x2="672" y2="688" stroke="url(#needle)" stroke-width="4" stroke-linecap="round"/>
  <line x1="300" y1="150" x2="660" y2="672" stroke="#eafffa" stroke-width="1.2" opacity="0.55"/>

  <!-- target crosshair at needle tip -->
  <circle cx="676" cy="694" r="34" fill="url(#target)"/>
  <g stroke="#bffbef" stroke-width="2" opacity="0.85" fill="none">
    <circle cx="676" cy="694" r="16"/>
    <line x1="676" y1="662" x2="676" y2="726"/>
    <line x1="644" y1="694" x2="708" y2="694"/>
  </g>

  <!-- scan frame accents -->
  <g fill="none" stroke="#9df5e3" stroke-width="2" opacity="0.45">
    <path d="M120 120 h60 M120 120 v60"/>
    <path d="M1080 120 h-60 M1080 120 v60"/>
    <path d="M120 780 h60 M120 780 v-60"/>
    <path d="M1080 780 h-60 M1080 780 v-60"/>
  </g>
</svg>
