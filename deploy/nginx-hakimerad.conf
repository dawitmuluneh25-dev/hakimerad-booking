# nginx vhost for the HakimeRAD booking app.
#
#   sudo install -m 0644 deploy/nginx-hakimerad.conf /etc/nginx/sites-available/booking.hakimerad.com
#   sudo ln -s /etc/nginx/sites-available/booking.hakimerad.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace booking.hakimerad.com with the real hostname. Certificates are assumed
# to come from certbot --nginx or certbot certonly; paths below are certbot's.
#
# The app sets its own security headers (HSTS, CSP frame-ancestors, nosniff,
# referrer policy). Do not duplicate them here: duplicated headers are either
# ignored or sent twice.

# Rate-limit zones live in the http{} context, so keep this block at the top of
# the file and include it only once per server.
limit_req_zone $binary_remote_addr zone=hakimerad_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hakimerad_write:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name booking.hakimerad.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name booking.hakimerad.com;

    ssl_certificate     /etc/letsencrypt/live/booking.hakimerad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.hakimerad.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # A referral document is capped at 15 MB by the app; leave room for the
    # multipart envelope and reject anything larger before it reaches Node.
    client_max_body_size 16m;
    client_body_timeout 60s;

    # Sign-in and the OIDC callback: the app has its own budget (60 and 90 per
    # 10 minutes per address). This outer layer is deliberately looser, so nginx
    # stops a flood cheaply and the app still answers a busy hospital morning.
    location ~ ^/auth/(sign-in|callback)$ {
        limit_req zone=hakimerad_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Anything that writes: submissions, uploads, status changes.
    location ~ ^/api/ {
        limit_req zone=hakimerad_write burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must not be cached, or clients keep the old shell.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Never serve dotfiles, even if a misconfiguration maps them.
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/hakimerad.access.log;
    error_log  /var/log/nginx/hakimerad.error.log warn;
}
